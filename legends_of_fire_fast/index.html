<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LEGENDS OF FIRE — Esports Tournament Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@500;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background-color: #080808; color: #F4F4F6; font-family: 'Inter', 'Hind Siliguri', sans-serif; overflow-x: hidden; }
    .fire-gradient-text { background: linear-gradient(135deg, #FF9900 0%, #FF4500 55%, #FF1E38 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glow-notice { background: linear-gradient(90deg, rgba(255, 85, 0, 0.16) 0%, rgba(19, 19, 24, 0.98) 50%, rgba(0, 163, 255, 0.16) 100%); border: 1px solid rgba(255, 102, 0, 0.38); box-shadow: 0 0 20px rgba(255, 85, 0, 0.14); }
    .wallet-card-bg { background: linear-gradient(135deg, #1E293B 0%, #0F172A 45%, #2E1065 100%); position: relative; overflow: hidden; }
    .view-section { display: none; animation: fadeSlideIn 0.2s ease-out; }
    .view-section.active { display: block; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-[#080808] text-gray-100 antialiased selection:bg-orange-500 selection:text-white">
  <div class="app-shell max-w-md mx-auto min-h-screen bg-[#080808] relative pb-28 shadow-2xl border-x border-[#181820]">
    <header class="rx-header sticky top-0 z-40 bg-[#080808]/95 backdrop-blur-md border-b border-[#1E1E26] px-4 py-3 flex items-center justify-between">
      <button type="button" onclick="navigateTo('home')" class="flex items-center gap-2.5 text-left focus:outline-none group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 via-red-600 to-amber-500 p-[1.5px] shadow-lg shadow-orange-600/30 shrink-0">
          <div class="w-full h-full bg-[#120402] rounded-[10px] flex items-center justify-center overflow-hidden">
            <span class="font-display font-extrabold text-xs text-orange-400">LOF</span>
          </div>
        </div>
        <div>
          <h1 class="font-display font-extrabold text-lg tracking-wider leading-none fire-gradient-text">LEGENDS OF FIRE</h1>
          <p class="text-[10px] text-gray-400 tracking-widest uppercase mt-0.5 font-semibold">Esports Arena</p>
        </div>
      </button>
    </header>

    <main id="view-home" class="view-section active px-3.5 pt-3 space-y-4">
      <div class="glow-notice rounded-2xl p-3.5 space-y-2.5">
        <div class="flex items-start gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-orange-500/20 border border-orange-500/40 flex items-center justify-center text-orange-400 shrink-0 mt-0.5">
            <i class="fa-solid fa-bullhorn text-xs"></i>
          </div>
          <p class="text-xs font-medium text-gray-200 leading-relaxed">
            Welcome to <span class="text-orange-400 font-bold">Legends of Fire</span>! Platform Ready.
          </p>
        </div>
      </div>
      <section>
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-orange-500 to-red-600"></span>
            <h2 class="font-display font-extrabold text-base tracking-wide text-white uppercase">Tournament Categories</h2>
          </div>
        </div>
        <div id="category-grid" class="grid grid-cols-2 gap-3"></div>
      </section>
    </main>
  </div>
  <script>
    const categories = [
      { id: 'BR MATCH', title: 'BR MATCH', gradient: 'from-orange-600 via-red-600 to-amber-500', icon: 'fa-fire' },
      { id: 'E-SPORTS MODE', title: 'E-SPORTS MODE', gradient: 'from-sky-500 via-blue-600 to-indigo-700', icon: 'fa-trophy' }
    ];
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('category-grid');
      grid.innerHTML = categories.map(cat => `
        <div class="rounded-2xl overflow-hidden border border-[#262632] bg-[#131318] p-3 text-white">
          <h3 class="font-bold text-sm">${cat.title}</h3>
        </div>
      `).join('');
    });
    function navigateTo(v) {}
  </script>
</body>
</html>
