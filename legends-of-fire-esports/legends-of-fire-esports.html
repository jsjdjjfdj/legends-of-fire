  <style>
    :root {
      --bg-main: #080808;
      --bg-card: #151515;
      --bg-elevated: #1E1E22;
      --fire-orange: #FF6A00;
      --ember-red: #FF3B00;
      --fire-gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1A0B05 0%, #050505 65%);
      color: var(--text-primary);
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-bangla { font-family: 'Hind Siliguri', 'Rajdhani', sans-serif; }
    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #080808;
      position: relative;
      box-shadow: 0 0 60px rgba(255, 106, 0, 0.14);
      border-left: 1px solid rgba(255, 106, 0, 0.14);
      border-right: 1px solid rgba(255, 106, 0, 0.14);
      padding-bottom: 88px;
      overflow-x: hidden;
    }
    .fire-gradient-text {
      background: linear-gradient(90deg, #FF6A00 0%, #FBBF24 50%, #FF3B00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .fire-btn {
      background: linear-gradient(135deg, #FF6A00 0%, #FF3B00 100%);
      box-shadow: 0 4px 18px rgba(255, 106, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .fire-btn:active { transform: scale(0.97); }
    .fire-border {
      border: 1px solid rgba(255, 106, 0, 0.25);
    }
    .card-surface {
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    /* Virtual Debit Card */
    .virtual-card {
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 106, 0, 0.08),
        rgba(255, 106, 0, 0.08) 10px,
        rgba(15, 23, 42, 0.5) 10px,
        rgba(15, 23, 42, 0.5) 20px
      ), linear-gradient(135deg, #2A1208 0%, #161822 55%, #1E110A 100%);
      border: 1px solid rgba(255, 106, 0, 0.35);
      box-shadow: 0 12px 30px rgba(255, 59, 0, 0.18);
    }
    /* Rainbow Glow Ring */
    .avatar-ring {
      background: conic-gradient(from 0deg, #FF6A00, #F59E0B, #10B981, #3B82F6, #EC4899, #FF6A00);
      padding: 3px;
      border-radius: 9999px;
      box-shadow: 0 0 22px rgba(255, 106, 0, 0.45);
    }
    /* Marquee */
    .marquee-wrap { overflow: hidden; white-space: nowrap; }
    .marquee-track {
      display: inline-block;
      padding-left: 100%;
      animation: marqueeAnim 18s linear infinite;
    }
    @keyframes marqueeAnim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    /* Floating Support */
    .support-fab {
      position: fixed;
      right: max(12px, calc(50vw - 208px));
      bottom: 92px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .support-fab-btn {
      width: 50px;
      height: 50px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #FF6A00, #FF3B00);
      box-shadow: 0 0 20px rgba(255, 106, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.2);
    }
    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: rgba(14, 14, 17, 0.96);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 106, 0, 0.22);
      z-index: 45;
      padding: 6px 6px 10px;
    }
    .nav-item.active .nav-pill {
      background: rgba(255, 106, 0, 0.16);
      color: #FF6A00;
    }
    .nav-item.active .nav-label {
      color: #FF6A00;
      font-weight: 700;
    }
    .nav-item.active .nav-dot {
      opacity: 1;
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

    // ==================== HELPERS ====================
    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      document.getElementById('toastText').textContent = msg;
      el.classList.remove('hidden');
      el.classList.add('flex');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }, 3000);

    function syncHeader() {
      const total = state.user.depositBalance + state.user.winningBalance;
      const el = document.getElementById('headerTotalBalance');
      if (el) el.textContent = `৳${total}`;
      const adminBtn = document.getElementById('adminToggleBtn');
      if (adminBtn) {
        adminBtn.textContent = state.isAdminMode ? 'PLAYER' : 'ADMIN';
        adminBtn.className = state.isAdminMode
          ? 'px-2.5 py-1 rounded-full text-[10px] font-orbitron font-bold tracking-wider bg-orange-500 text-white shadow-md shadow-orange-500/40'
          : 'px-2.5 py-1 rounded-full text-[10px] font-orbitron font-bold tracking-wider border border-orange-500/40 bg-orange-500/10 text-orange-400';
      }
    }

    function navigate(view, extra = null) {
      if (extra) state.selectedCategory = extra;
      state.currentView = view;
      state.isAdminMode = false;
      syncHeader();

      document.querySelectorAll('.nav-item').forEach(btn => {
        const isActive = btn.dataset.tab === view;
        btn.classList.toggle('active', isActive);
      });

      const header = document.getElementById('topHeader');
      const bottomNav = document.getElementById('bottomNav');
      const fab = document.getElementById('floatingSupport');

      if (!state.isAuthenticated || view === 'auth') {
        header.classList.add('hidden');
        bottomNav.classList.add('hidden');
        fab.classList.add('hidden');
        renderAuthView();
        return;
      } else {
        header.classList.remove('hidden');
        bottomNav.classList.remove('hidden');
        fab.classList.remove('hidden');
      }

      const main = document.getElementById('mainContainer');
      if (view === 'home') renderHomeView(main);
      else if (view === 'category') renderCategoryMatchesView(main);
      else if (view === 'matches') renderMyMatchesView(main);
      else if (view === 'players') renderPlayersView(main);
      else if (view === 'shop') renderShopView(main);
      else if (view === 'profile') renderProfileView(main);
      else if (view === 'add-money') renderAddMoneySelectView(main);
      else if (view === 'withdraw') renderWithdrawView(main);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleAdminMode() {
      state.isAdminMode = !state.isAdminMode;
      syncHeader();
      const main = document.getElementById('mainContainer');
      if (state.isAdminMode) renderAdminView(main);

    function buyShopItem(itemName, price, isDiamond) {
      const total = state.user.depositBalance + state.user.winningBalance;
      if (total < price) {

        navigate('add-money');
        return;

      if (state.user.depositBalance >= price) {

        state.user.depositBalance = 0;
        state.user.winningBalance -= rem;
      }
      const uid = isDiamond ? (document.getElementById('topupTargetUid')?.value || state.user.uid) : '';
      state.transactions.unshift({

        type: isDiamond ? 'Diamond Top-Up' : 'Shop Order',

        trxId: isDiamond ? `UID:${uid}` : itemName.slice(0, 10),
        amount: -price,
        status: 'Completed',
        time: 'Just now'
      });
      syncHeader();
      showToast(`${itemName} ordered successfully!`);
      renderShopView(document.getElementById('mainContainer'));
    }

    function submitWithdraw() {
      const method = document.getElementById('wdMethod').value;
      const num = document.getElementById('wdNumber').value.trim();
      const amount = Number(document.getElementById('wdAmount').value || 0);
      if (amount < 110 || amount > 1000) {
        showToast('Withdraw amount must be between ৳110 and ৳1,000.');
        return;
      }
      if (state.user.winningBalance < amount) {
        showToast('Insufficient Winning Balance!');
        return;
      }
      if (num.length < 11) {
        showToast('Enter a valid 11-digit mobile wallet number.');
        return;
      }
      state.user.winningBalance -= amount;
      state.transactions.unshift({
        id: 'WD' + Math.floor(100 + Math.random() * 900),
        type: 'Withdraw',
        method,
        trxId: num,
        amount: -amount,
        status: 'Pending',
        time: 'Just now'
      });
      syncHeader();
      showToast('Withdrawal request submitted! Fee ৳10 applied.');
      navigate('profile');
    }

      syncHeader();
      showToast(`Transaction ${id} Approved!`);
      renderAdminView(document.getElementById('mainContainer'));

    function confirmJoinMatch(e, matchId) {
      e.preventDefault();
      const m = state.tournaments.find(t => t.id === matchId);
      if (!m || m.registered) return;
      const total = state.user.depositBalance + state.user.winningBalance;
      if (total < m.entryFee) {
        closeAllModals();
        showToast('Insufficient balance! Add money to join.');
        navigate('add-money');
        return;
      }
      if (state.user.depositBalance >= m.entryFee) state.user.depositBalance -= m.entryFee;
      else {
        const rem = m.entryFee - state.user.depositBalance;
        state.user.depositBalance = 0;
        state.user.winningBalance -= rem;
      }
      m.registered = true;
      m.joinedSlots += 1;
      state.transactions.unshift({
        id: 'TX' + Math.floor(100 + Math.random() * 900),
        type: 'Match Entry',
        method: 'Wallet',
        trxId: m.title.slice(0, 12),
        amount: -m.entryFee,
        status: 'Completed',
        time: 'Just now'
      });
      syncHeader();
      closeAllModals();
      showToast('Slot Confirmed! Room ID unlocked.');
      navigate('matches');
    }

    function saveProfileEdits(e) {
      e.preventDefault();
      state.user.name = document.getElementById('editName').value.trim();
      state.user.uid = document.getElementById('editUid').value.trim();
      state.user.role = document.getElementById('editRole').value;
      state.user.whatsapp = document.getElementById('editWa').value.trim();
      state.user.hireRate = document.getElementById('editRate').value.trim();
      closeAllModals();
      showToast('Profile & Roster Card updated!');
      renderProfileView(document.getElementById('mainContainer'));
    }

    function closeAllModals() {
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    // ==================== BOOT ====================
    setInterval(() => {
      if (state.currentView === 'home' && !state.isAdminMode && state.isAuthenticated) {
        state.bannerIndex = (state.bannerIndex + 1) % state.banners.length;
        renderHomeView(document.getElementById('mainContainer'));
      }
    }, 5000);

    syncHeader();
    navigate('home');
  </script>
</body>
</html>
