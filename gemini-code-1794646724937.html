<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LEGENDS OF FIRE — Free Fire Esports Tournament Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #080808;
      --bg-card: #151515;
      --bg-elevated: #1E1E22;
      --fire-orange: #FF6A00;
      --ember-red: #FF3B00;
      --fire-gold: #F59E0B;
      --text-primary: #F8FAFC;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1A0B05 0%, #050505 65%);
      color: var(--text-primary);
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-bangla { font-family: 'Hind Siliguri', 'Rajdhani', sans-serif; }
    .app-shell {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #080808;
      position: relative;
      box-shadow: 0 0 60px rgba(255, 106, 0, 0.14);
      border-left: 1px solid rgba(255, 106, 0, 0.14);
      border-right: 1px solid rgba(255, 106, 0, 0.14);
      padding-bottom: 88px;
      overflow-x: hidden;
    }
    .fire-gradient-text {
      background: linear-gradient(90deg, #FF6A00 0%, #FBBF24 50%, #FF3B00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .fire-btn {
      background: linear-gradient(135deg, #FF6A00 0%, #FF3B00 100%);
      box-shadow: 0 4px 18px rgba(255, 106, 0, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .fire-btn:active { transform: scale(0.97); }
    .card-surface {
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .virtual-card {
      background: repeating-linear-gradient(
        -45deg,
        rgba(255, 106, 0, 0.08),
        rgba(255, 106, 0, 0.08) 10px,
        rgba(15, 23, 42, 0.5) 10px,
        rgba(15, 23, 42, 0.5) 20px
      ), linear-gradient(135deg, #2A1208 0%, #161822 55%, #1E110A 100%);
      border: 1px solid rgba(255, 106, 0, 0.35);
      box-shadow: 0 12px 30px rgba(255, 59, 0, 0.18);
    }
    .avatar-ring {
      background: conic-gradient(from 0deg, #FF6A00, #F59E0B, #10B981, #3B82F6, #EC4899, #FF6A00);
      padding: 3px;
      border-radius: 9999px;
      box-shadow: 0 0 22px rgba(255, 106, 0, 0.45);
    }
    .marquee-wrap { overflow: hidden; white-space: nowrap; }
    .marquee-track {
      display: inline-block;
      padding-left: 100%;
      animation: marqueeAnim 18s linear infinite;
    }
    @keyframes marqueeAnim {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
